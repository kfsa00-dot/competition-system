<!-- 失敗提示：若程式庫載入失敗或出錯，顯示訊息而不是一片空白 -->
<script>
window.addEventListener('error', function (e) {
  window.__gfError = (e && e.message) || '未知錯誤';
});
window.addEventListener('load', function () {
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && root.children.length > 0) return; // 正常顯示，不處理
    var miss = [];
    if (!window.React) miss.push('React');
    if (!window.ReactDOM) miss.push('ReactDOM');
    root.innerHTML =
      '<div style="max-width:560px;margin:60px auto;padding:22px 24px;border:1.5px solid #FECACA;' +
      'background:#FEF2F2;border-radius:14px;font-family:sans-serif;color:#991B1B;line-height:1.9">' +
      '<div style="font-size:17px;font-weight:800;margin-bottom:8px">⚠ 網頁載入失敗</div>' +
      '<div style="font-size:13.5px">' +
      (miss.length
        ? '無法載入必要的程式庫：<b>' + miss.join('、') + '</b>。<br>' +
          '多半是網路擋住了外部網站，請改用手機網路或家中網路再試一次，' +
          '或請資訊組將 <b>unpkg.com</b> 與 <b>cdn.jsdelivr.net</b> 加入白名單。'
        : '程式執行發生錯誤：<br><code style="font-size:12px">' +
          (window.__gfError || '未知錯誤') + '</code>') +
      '<br><br>請先按 <b>Ctrl+Shift+R</b>（Mac 為 <b>Cmd+Shift+R</b>）重新整理試試。' +
      '</div></div>';
  }, 4000);
});

async function apiLoadAll() {
  const url = getBackendUrl();
  if (!url) throw new Error("no-url");
  const r = await fetch(url + (url.includes("?") ? "&" : "?") + "action=all&t=" + Date.now());
  if (!r.ok) throw new Error("http " + r.status);
  return await r.json();
}
// POST 寫入（用 text/plain 避免 CORS 預檢）
async function apiPost(payload) {
  const url = getBackendUrl();
  if (!url) throw new Error("no-url");
  const r = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  });
  try {
    return await r.json();
  } catch {
    return {
      result: "ok"
    };
  }
}
